  - id: inegi_bie
    tipo: api
    # TODO: indicadores de INPC "Vivienda" por ciudad/entidad del BIE de INEGI
    # url ejemplo: https://www.inegi.org.mx/app/api/indicadores/desarrolladores/jsonxml/INDICATOR/{id}/es/0700/false/BIE/2.0/{token}?type=json
    activa: false
