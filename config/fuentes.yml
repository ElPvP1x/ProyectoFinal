# Fuentes del observatorio (capa Bronce). Agregar/quitar aqui, no en el codigo.
# IDs marcados "VERIFICAR": confirmarlos en el catalogo antes de correr (el extractor avisa si una serie viene vacia).
fuentes:
  - id: banxico_sie
    tipo: api
    url_base: https://www.banxico.org.mx/SieAPIRest/service/v1/series
    token_env: BANXICO_TOKEN          # secreto de GitHub Actions
    desde: "2010-01-01"               # >= 36 periodos mensuales de sobra
    series:
      - {id: SF43718, nombre: tipo_cambio_fix_usd_mxn_diario}   # FIX, lo usa el Sistema Contable para convertir CFDI en USD
      - {id: SP1, nombre: inpc_general_mensual}                 # ya capturada desde E0
      - {id: SF43783, nombre: tiie_28_dias_diaria}              # VERIFICAR id en el catalogo SIE
      - {id: SP68257, nombre: valor_udis_diario}                # VERIFICAR id en el catalogo SIE
  - id: inegi_bie
    tipo: api
    token_env: INEGI_TOKEN            # secreto de GitHub Actions; si falta, se omite con aviso
    url_base: https://www.inegi.org.mx/app/api/indicadores/desarrolladores/jsonxml/INDICATOR
    area: "0700"                      # 0700 = nacional
    series:
      - {id: "628194", nombre: inpc_general_inegi_mensual}      # VERIFICAR id en el BIE
  # --- E2: fuente especializada geoespacial (sin token, sin datos personales) ---
  - id: osm_overpass
    tipo: geoespacial
    url_base: https://overpass-api.de/api/interpreter
    licencia: "ODbL 1.0 (© colaboradores de OpenStreetMap)"
    serie: infraestructura_contable_mx
    pais: MX
    filtros:                                   # una consulta por corrida
      - '"office"~"^(accountant|tax_advisor)$"'  # despachos contables y asesores fiscales
      - '"government"="tax"'                     # oficinas de recaudación
      - '"name"~"Servicio de Administraci.n Tributaria|^SAT( |$)",i'
      - '"amenity"="bank"'                       # bancos: conciliaciones y pagos de impuestos
  - id: geoboundaries
    tipo: geoespacial
    url_base: https://www.geoboundaries.org/api/current/gbOpen/MEX/ADM1/
    licencia: "CC BY 3.0 IGO (geoBoundaries, fuente INEGI)"
    serie: entidades_mx_adm1
  - id: inegi_denue
    tipo: geoespacial
    url_base: https://www.inegi.org.mx/contenidos/masiva/denue/denue_00_54_csv.zip   # descarga masiva, sin token
    licencia: "Terminos de Libre Uso de la Informacion del INEGI"
    serie: denue_sector54
    actividades: ["541211", "541219"]   # servicios de contabilidad y auditoria; otros relacionados con la contabilidad
    vigencia_dias: 90                   # el DENUE se actualiza cada semestre: no se vuelve a bajar antes
